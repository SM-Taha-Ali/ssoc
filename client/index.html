<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Operation Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('ssoc_theme_mode') || 'dark';
          var accent = localStorage.getItem('ssoc_theme_accent') || 'purple';
          var doc = document.documentElement;
          doc.setAttribute('data-mode', mode);
          doc.setAttribute('data-accent', accent);
          if (mode === 'light') {
            doc.classList.remove('dark');
            doc.classList.add('light');
          } else {
            doc.classList.remove('light');
            doc.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-primary font-sans antialiased selection:bg-brand-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
